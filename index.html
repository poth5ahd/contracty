.pv::after{content:"";position:absolute;width:420px;height:420px;border-radius:50%;border:50px solid rgba(255,255,255,.04);top:-250px;inset-inline-end:90px;pointer-events:none}
.pv .t{width:56px;height:56px;border-radius:14px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22);display:grid;place-items:center;flex:none}.pv .t .ic{width:24px;height:24px}
.pv h3{color:#fff;font-size:24px;margin:0 0 6px;letter-spacing:-.02em}.pv p{margin:0;color:#c6d2f2;font-size:13.5px;max-width:44em}.pv p.eb{color:#9db6ff;margin:0 0 6px}.pv .wbtn{margin-inline-start:auto;flex:none;position:relative;z-index:1}
.fq{display:grid;grid-template-columns:.8fr 1.2fr;gap:64px;padding:92px 0 72px}
.fq h2{font-size:clamp(32px,4.4vw,50px);line-height:1.05;letter-spacing:-.03em;margin:0 0 16px;color:var(--h)}.fq h2 span,.fq h2 em{display:block}.fq h2 em{font-style:normal;color:#3f6bbf}
.sb{color:var(--mut);margin:0 0 18px}.lk{display:inline-flex;align-items:center;gap:8px;font-weight:700;color:var(--h);text-decoration:none}.lk .ic{width:14px;height:14px}
#faq details{border:0;border-top:1px solid var(--line);padding:20px 0}#faq details:last-child{border-bottom:1px solid var(--line)}
#faq summary{font-size:16px;color:var(--h)}summary::after,details[open] summary::after{display:none}
#faq p{font-size:14px;max-width:38em}
.pm{position:relative;width:28px;height:28px;border-radius:8px;background:var(--soft);flex:none;transition:transform .3s,background .3s}.pm::before,.pm::after{content:"";position:absolute;left:50%;top:50%;width:11px;height:2px;border-radius:2px;background:var(--h);transform:translate(-50%,-50%)}.pm::after{transform:translate(-50%,-50%) rotate(90deg)}
details[open] .pm{background:var(--h);transform:rotate(45deg)}details[open] .pm::before,details[open] .pm::after{background:#fff}
.cb{padding:72px 0;margin-top:20px}.cbi{display:flex;align-items:center;gap:26px}.cbi .wbtn{margin-inline-start:auto;flex:none}
.cb .t{width:72px;height:72px;border-radius:18px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.22);display:grid;place-items:center;flex:none}
.cb h2{font-size:clamp(28px,3.6vw,40px);max-width:11em;margin:0 0 8px}.cb .dl{margin:0;font-size:14px}
@media(max-width:820px){.hw,.fq{grid-template-columns:1fr;gap:34px}.dk{padding:60px 0}.pv,.cbi{flex-wrap:wrap}.pv .wbtn,.cbi .wbtn{margin:0}.fq{padding:60px 0 40px}.pv{padding:24px}}
</style>
